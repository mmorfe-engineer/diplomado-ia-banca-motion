name: Validate source and documentation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm ls --depth=0
      - run: npm run docs:check
